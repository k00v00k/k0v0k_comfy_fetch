[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "comfy-fetch"
version = "0.7.49"
description = "Fetch, cache, and manage remote assets and model artifacts for ComfyUI workflows."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
  { name = "k0v0k" }
]
dependencies = [
  "aiohttp>=3.9"
]
classifiers = [
  "Operating System :: OS Independent"
]

[project.urls]
Repository = "https://github.com/k00v00k/k0v0k_comfy_fetch"
Documentation = "https://github.com/k00v00k/k0v0k_comfy_fetch#readme"
"Bug Tracker" = "https://github.com/k00v00k/k0v0k_comfy_fetch/issues"

[tool.comfy]
PublisherId = "k00v00k"
DisplayName = "Comfy-Fetch"
Icon = "https://raw.githubusercontent.com/k00v00k/k0v0k_comfy_fetch/main/assets/comfy-fetch-icon.svg"
requires-comfyui = ">=1.0.0"

[tool.setuptools]
packages = [
  "plugin",
  "plugin.k0v0k_comfy_fetch"
]
